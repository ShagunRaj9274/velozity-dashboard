# Render Blueprint — API + PostgreSQL. (Frontend is on Vercel; see README → Deployment.)
databases:
  - name: velozity-db
    plan: free
    databaseName: velozity
    user: velozity

services:
  - type: web
    name: velozity-api
    runtime: node
    rootDir: server
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: velozity-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN # your Vercel URL, e.g. https://velozity-dashboard.vercel.app
        sync: false
      - key: COOKIE_SAMESITE
        value: lax
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY_HOPS # Vercel rewrite → Render proxy → app
        value: "2"
